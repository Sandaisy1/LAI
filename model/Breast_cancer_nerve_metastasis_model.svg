<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360mm" height="210mm" viewBox="0 0 2600 1520"
     font-family="Arial, Liberation Sans, Helvetica, sans-serif">
  <title>Red protein limits nerve-mediated lung metastasis</title>
  <desc>Within a breast cancer cell, red protein binds blue protein and blocks yellow-dependent exit of neuroactive vesicles from the endoplasmic reticulum. Vesicles taken up by a neuron increase mitochondrial activity and axon regeneration. Tumor cells spread along the axon into a blood vessel or lymph node and seed the lung.</desc>
  <rect id="Background" width="2600" height="1520" fill="#FFFEFB"/>

  <!-- ===================== Tumor cell, molecular ===================== -->
  <g id="Breast_cancer_cell">
    <path d="M230,200
             C110,250 78,460 112,680
             C142,900 210,1100 400,1168
             C590,1236 790,1140 848,920
             C900,730 888,460 800,310
             C720,180 500,150 230,200 Z"
          fill="#FBF7F4" stroke="#C98984" stroke-width="2.2"/>
    <path d="M250,230
             C150,272 124,460 152,660
             C176,850 236,1030 400,1090
             C560,1148 730,1070 778,890
             C820,730 808,490 734,360
             C668,246 490,214 250,230 Z"
          fill="none" stroke="#E7C8C4" stroke-width="1.2"/>
    <!-- nucleus -->
    <path d="M250,300 C200,330 188,410 214,470 C240,528 310,548 360,520 C410,492 428,410 400,350 C372,292 300,272 250,300 Z"
          fill="#F6E7E2" stroke="#D7B5AE" stroke-width="1.4"/>
    <ellipse cx="318" cy="410" rx="10" ry="8" fill="#E4B2A8"/>
    <text x="470" y="128" text-anchor="middle" font-size="28" fill="#243038">Breast cancer cell</text>
  </g>

  <g id="Protein_complex">
    <rect x="392" y="392" width="188" height="96" rx="48" fill="#F8ECEC"/>
    <circle id="Blue_protein" cx="448" cy="440" r="28" fill="#2C5F8A"/>
    <circle id="Red_protein" cx="508" cy="440" r="28" fill="#C23B4A"/>
    <circle id="Yellow_protein" cx="708" cy="440" r="28" fill="#E0B03A"/>
    <g id="Inhibition_symbol" fill="none" stroke="#C23B4A" stroke-width="2.2" stroke-linecap="round">
      <path d="M546,440 H668"/>
      <path d="M668,422 V458"/>
    </g>
    <text x="448" y="498" text-anchor="middle" font-size="16" fill="#243038">Blue protein</text>
    <text x="508" y="378" text-anchor="middle" font-size="16" fill="#243038">Red protein</text>
    <text x="708" y="378" text-anchor="middle" font-size="16" fill="#243038">Yellow protein</text>
  </g>

  <g id="Endoplasmic_reticulum" fill="#F4F1FA" stroke="#7D7394" stroke-width="1.3">
    <path d="M210,620 C300,590 420,594 530,630 C420,654 300,650 210,620 Z"/>
    <path d="M220,678 C316,648 436,652 560,690 C436,714 316,710 220,678 Z"/>
    <path d="M232,736 C328,706 448,710 575,748 C448,772 328,768 232,736 Z"/>
    <path d="M246,794 C336,766 448,770 555,806 C448,828 336,824 246,794 Z"/>
    <g id="Ribosomes" fill="#7D7394" stroke="none">
      <circle cx="250" cy="608" r="2.1"/><circle cx="290" cy="598" r="2.1"/><circle cx="340" cy="602" r="2.1"/>
      <circle cx="400" cy="612" r="2.1"/><circle cx="460" cy="622" r="2.1"/>
      <circle cx="260" cy="666" r="2.1"/><circle cx="320" cy="656" r="2.1"/><circle cx="390" cy="662" r="2.1"/>
      <circle cx="470" cy="678" r="2.1"/><circle cx="250" cy="724" r="2.1"/><circle cx="330" cy="714" r="2.1"/>
      <circle cx="420" cy="724" r="2.1"/><circle cx="500" cy="740" r="2.1"/><circle cx="280" cy="782" r="2.1"/>
      <circle cx="360" cy="774" r="2.1"/><circle cx="450" cy="790" r="2.1"/>
    </g>
    <text x="210" y="870" font-size="16" fill="#5C6770">Endoplasmic reticulum</text>
  </g>

  <g id="Blocked_vesicle">
    <path d="M560,760 C590,748 628,770 626,808 C624,844 586,860 558,842 C530,824 532,778 560,760 Z"
          fill="#FBF4DE" stroke="#C6A15E" stroke-width="1.6"/>
    <path d="M566,778 C588,774 606,792 604,816 C602,836 580,844 564,832 C548,820 546,790 566,778 Z"
          fill="#F8E7B8" stroke="none"/>
    <g fill="#2C5F8A">
      <circle cx="578" cy="804" r="3.2"/>
      <circle cx="592" cy="816" r="3.2"/>
      <circle cx="574" cy="822" r="2.6"/>
    </g>
    <text x="640" y="830" font-size="16" fill="#5C6770">Neuroactive protein</text>
    <text x="250" y="980" font-size="16" fill="#5C6770">Red protein binds blue protein and prevents</text>
    <text x="250" y="1004" font-size="16" fill="#5C6770">yellow-dependent vesicle formation</text>
  </g>

  <!-- ===================== Vesicles crossing to the neuron ===================== -->
  <g id="Secretory_vesicles">
    <text x="1040" y="250" text-anchor="middle" font-size="16" fill="#5C6770">Secretory vesicles</text>
    <g id="Vesicle_1" transform="translate(980,340)">
      <ellipse rx="30" ry="26" fill="#FBF4DE" stroke="#C6A15E" stroke-width="1.7"/>
      <ellipse rx="20" ry="16" fill="#F8E7B8"/>
      <g fill="#2C5F8A">
        <circle cx="-6" cy="-3" r="3"/>
        <circle cx="5" cy="2" r="3"/>
        <circle cx="-2" cy="7" r="2.4"/>
      </g>
    </g>
    <g id="Vesicle_2" transform="translate(1088,450)">
      <ellipse rx="26" ry="22" fill="#FBF4DE" stroke="#C6A15E" stroke-width="1.7"/>
      <ellipse rx="16" ry="13" fill="#F8E7B8"/>
      <g fill="#2C5F8A">
        <circle cx="-4" cy="-2" r="2.6"/>
        <circle cx="4" cy="3" r="2.6"/>
        <circle cx="-1" cy="7" r="2.1"/>
      </g>
    </g>
    <g id="Vesicle_3" transform="translate(1168,330)">
      <ellipse rx="24" ry="20" fill="#FBF4DE" stroke="#C6A15E" stroke-width="1.6"/>
      <ellipse rx="15" ry="12" fill="#F8E7B8"/>
      <g fill="#2C5F8A">
        <circle cx="-4" cy="-1" r="2.4"/>
        <circle cx="4" cy="3" r="2.4"/>
        <circle cx="0" cy="7" r="2"/>
      </g>
    </g>
  </g>

  <!-- ===================== Neuron ===================== -->
  <g id="Neuron">
    <text x="1450" y="150" text-anchor="middle" font-size="28" fill="#243038">Neuron</text>
    <g fill="none" stroke="#3E7A5A" stroke-width="2.2" stroke-linecap="round">
      <path d="M1388,250 C1360,190 1430,150 1410,112"/>
      <path d="M1510,246 C1570,190 1560,145 1630,124"/>
      <path d="M1348,290 C1280,250 1260,190 1208,168"/>
      <path d="M1410,112 l-8,16 M1418,118 l8,10"/>
      <path d="M1630,124 l-6,16 M1636,132 l10,8"/>
    </g>
    <path d="M1320,360
             C1260,400 1256,500 1308,560
             C1360,620 1520,640 1590,580
             C1660,520 1668,400 1600,350
             C1540,306 1380,320 1320,360 Z"
          fill="#F4FAF6" stroke="#3E7A5A" stroke-width="2"/>
    <path d="M1410,430 C1388,450 1396,510 1440,522 C1484,534 1528,500 1524,458 C1520,418 1452,404 1410,430 Z"
          fill="#E4F0E6" stroke="#8FB39A" stroke-width="1"/>
    <ellipse cx="1468" cy="478" rx="7" ry="5" fill="#B7D0BC"/>
    <!-- uptake -->
    <path d="M1318,470 C1296,448 1292,512 1328,524" fill="#F4FAF6" stroke="#3E7A5A" stroke-width="2"/>
    <g id="Internalized_vesicle" transform="translate(1348,492)">
      <ellipse rx="18" ry="15" fill="#FBF4DE" stroke="#C6A15E" stroke-width="1.4"/>
      <ellipse rx="11" ry="8" fill="#F8E7B8"/>
      <g fill="#2C5F8A">
        <circle cx="-3" cy="-1" r="2"/>
        <circle cx="3" cy="2" r="2"/>
      </g>
    </g>
  </g>

  <g id="Mitochondria" fill="#F8E3D4" stroke="#C46B3A" stroke-width="1.3">
    <g transform="translate(1428,545) rotate(-24)">
      <path d="M-26,-10 C-10,-20 16,-18 28,-6 C16,8 -8,10 -26,2 C-34,-2 -34,-6 -26,-10 Z"/>
      <path d="M-14,-2 H16 M-8,-8 V6 M2,-9 V7 M12,-6 V5" fill="none"/>
    </g>
    <g transform="translate(1516,540) rotate(18)">
      <path d="M-24,-9 C-8,-18 16,-16 26,-5 C14,8 -8,9 -24,1 C-32,-3 -32,-6 -24,-9 Z"/>
      <path d="M-12,-1 H14 M-6,-7 V5 M4,-8 V6" fill="none"/>
    </g>
    <g transform="translate(1472,590) rotate(6)">
      <path d="M-22,-8 C-6,-16 14,-14 22,-4 C12,7 -6,8 -22,1 C-28,-2 -28,-5 -22,-8 Z"/>
      <path d="M-10,-1 H12 M-4,-6 V5 M5,-7 V5" fill="none"/>
    </g>
    <text x="1360" y="640" font-size="16" fill="#5C6770">Mitochondrial activity</text>
  </g>

  <ellipse id="Stroma" cx="1780" cy="1080" rx="300" ry="200" fill="#F6F3EE"/>

  <g id="Tumor_mass" fill="#D7E6F2" stroke="#5E86A8" stroke-width="1.15">
    <path d="M1588,1040 C1620,996 1700,988 1744,1028 C1784,1064 1772,1140 1720,1172 C1664,1204 1588,1168 1572,1108 C1560,1064 1564,1068 1588,1040 Z"/>
    <path d="M1708,1008 C1748,972 1832,980 1868,1032 C1900,1080 1872,1156 1812,1176 C1752,1196 1688,1148 1684,1088 C1680,1044 1676,1036 1708,1008 Z"/>
    <path d="M1648,1160 C1684,1128 1760,1132 1792,1180 C1820,1224 1792,1292 1732,1304 C1672,1316 1612,1272 1612,1216 C1612,1176 1616,1184 1648,1160 Z"/>
    <path d="M1768,1168 C1808,1136 1888,1152 1912,1208 C1932,1256 1896,1316 1836,1324 C1776,1332 1728,1284 1736,1232 C1742,1196 1736,1192 1768,1168 Z"/>
    <g fill="#F8E8E2" stroke="#E2C2BA" stroke-width="0.8">
      <ellipse cx="1676" cy="1096" rx="15" ry="11"/>
      <ellipse cx="1792" cy="1092" rx="15" ry="11"/>
      <ellipse cx="1712" cy="1232" rx="14" ry="11"/>
      <ellipse cx="1832" cy="1248" rx="14" ry="11"/>
    </g>
  </g>

  <g id="Axon">
    <path d="M1588,545
             C1720,575 1840,690 1900,830
             C1960,970 1920,1100 1840,1185"
          fill="none" stroke="#E5F2EA" stroke-width="42" stroke-linecap="round"/>
    <path d="M1588,545
             C1720,575 1840,690 1900,830
             C1960,970 1920,1100 1840,1185"
          fill="none" stroke="#2F6B58" stroke-width="6.5" stroke-linecap="round"/>
    <g fill="#F7FBF8" stroke="#8FB39A" stroke-width="1">
      <ellipse cx="1748" cy="610" rx="15" ry="6.5" transform="rotate(14 1748 610)"/>
      <ellipse cx="1888" cy="860" rx="15" ry="6.5" transform="rotate(42 1888 860)"/>
    </g>
    <g id="Growth_cone" fill="none" stroke="#2F6B58" stroke-width="1.5" stroke-linecap="round">
      <path d="M1840,1185 C1804,1236 1772,1260 1748,1244"/>
      <path d="M1840,1185 C1836,1248 1864,1292 1900,1304"/>
      <path d="M1840,1185 C1888,1232 1944,1248 1980,1232"/>
      <path d="M1840,1185 C1876,1164 1924,1136 1952,1108"/>
    </g>
    <text x="1688" y="1360" text-anchor="middle" font-size="16" fill="#5C6770">Axon regeneration</text>
  </g>

  <g id="Cells_on_axon" fill="#D7E6F2" stroke="#5E86A8" stroke-width="1.15">
    <path d="M1668,600 C1704,572 1764,584 1780,628 C1794,668 1764,712 1716,714 C1668,716 1636,676 1648,634 C1656,606 1644,618 1668,600 Z"/>
    <path d="M1808,760 C1848,730 1916,748 1932,800 C1946,848 1908,896 1856,894 C1804,892 1772,844 1788,796 C1798,764 1780,780 1808,760 Z"/>
    <path d="M1868,980 C1904,952 1968,972 1980,1024 C1990,1068 1952,1112 1904,1108 C1856,1104 1828,1056 1844,1012 C1854,980 1844,998 1868,980 Z"/>
    <g fill="#F8E8E2" stroke="#E2C2BA" stroke-width="0.8">
      <ellipse cx="1724" cy="656" rx="13" ry="10"/>
      <ellipse cx="1868" cy="824" rx="13" ry="10"/>
      <ellipse cx="1924" cy="1044" rx="13" ry="10"/>
    </g>
    <text x="1540" y="860" text-anchor="middle" font-size="16" fill="#243038">Tumor cells spread</text>
    <text x="1540" y="882" text-anchor="middle" font-size="16" fill="#243038">along the neuron</text>
  </g>

  <g id="Blood_vessel">
    <path d="M2088,1020
             C2148,1004 2248,1036 2296,1104
             C2336,1160 2316,1248 2256,1280
             C2196,1312 2116,1280 2096,1216
             C2076,1152 2068,1064 2088,1020 Z"
          fill="#F8E8E8" stroke="#D98989" stroke-width="1.3"/>
    <path d="M2124,1052 C2176,1064 2236,1112 2256,1172 C2268,1212 2244,1256 2204,1268"
          fill="none" stroke="#E7B7B7" stroke-width="11" stroke-linecap="round"/>
    <g fill="#E07A7A">
      <ellipse cx="2180" cy="1128" rx="8" ry="5.5"/>
      <ellipse cx="2212" cy="1184" rx="8" ry="5.5"/>
      <ellipse cx="2188" cy="1232" rx="7" ry="5"/>
    </g>
    <path d="M2196,1152 C2210,1138 2236,1148 2236,1172 C2236,1192 2212,1204 2196,1192 C2180,1180 2182,1164 2196,1152 Z"
          fill="#D7E6F2" stroke="#5E86A8" stroke-width="1"/>
    <g fill="#F4C9C9">
      <ellipse cx="2144" cy="1084" rx="7" ry="3" transform="rotate(18 2144 1084)"/>
      <ellipse cx="2268" cy="1216" rx="7" ry="3" transform="rotate(-24 2268 1216)"/>
    </g>
    <text x="2196" y="1356" text-anchor="middle" font-size="16" fill="#5C6770">Blood vessel</text>
  </g>

  <g id="Lymph_node">
    <path d="M2288,760
             C2288,688 2400,668 2472,716
             C2556,772 2548,892 2456,936
             C2380,972 2292,932 2284,860
             C2280,820 2316,812 2340,832
             C2376,860 2388,816 2368,792
             C2348,768 2316,788 2288,760 Z"
          fill="#F7F1EA" stroke="#B29378" stroke-width="1.4"/>
    <g fill="#F1E4D8" stroke="#E2D0C0" stroke-width="0.8">
      <circle cx="2396" cy="804" r="18"/>
      <circle cx="2456" cy="848" r="13"/>
      <circle cx="2372" cy="860" r="12"/>
    </g>
    <path d="M2408,820 C2424,804 2452,814 2452,838 C2452,860 2428,872 2410,860 C2392,848 2392,834 2408,820 Z"
          fill="#D7E6F2" stroke="#5E86A8" stroke-width="1"/>
    <text x="2416" y="1004" text-anchor="middle" font-size="16" fill="#5C6770">Lymph node</text>
  </g>

  <g id="Lung">
    <path d="M2140,168
             C2088,208 2084,320 2144,372
             C2192,412 2276,400 2312,344
             C2340,396 2416,388 2416,320
             C2416,244 2368,180 2292,176
             C2244,140 2184,150 2140,168 Z"
          fill="#F6F7F8" stroke="#8E99A3" stroke-width="1.5"/>
    <path d="M2224,236 C2264,256 2284,304 2256,332" fill="none" stroke="#C5CED6" stroke-width="3" stroke-linecap="round"/>
    <g fill="#E7C2C2" stroke="#C98984" stroke-width="0.9">
      <path d="M2232,268 C2248,256 2272,266 2272,288 C2272,308 2252,318 2236,308 C2220,298 2216,280 2232,268 Z"/>
      <path d="M2264,292 C2276,284 2292,292 2292,308 C2292,322 2278,328 2266,320 C2254,312 2252,300 2264,292 Z"/>
    </g>
    <text x="2276" y="452" text-anchor="middle" font-size="16" fill="#243038">Lung metastasis</text>
  </g>
</svg>
