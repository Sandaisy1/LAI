<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="430mm" height="270mm" viewBox="0 0 2580 1620"
     font-family="Arial, Liberation Sans, Helvetica, sans-serif">
  <title>Red protein limits breast cancer lung metastasis</title>
  <desc>Cartoon model. Red protein binds blue protein and blocks yellow-dependent formation of neuroactive vesicles at the endoplasmic reticulum. Released vesicles are taken up by a neuron, raising mitochondrial activity and axon regeneration. Breast cancer cells then travel along the axon into a blood vessel or a lymph node and reach the lung.</desc>
  <rect id="Background" width="2580" height="1620" fill="#FFFFFF"/>

  <!-- ===================== Breast cancer cell ===================== -->
  <g id="Breast_cancer_cell">
    <path d="M250,170
             C120,210 70,380 100,560
             C128,740 190,920 360,1000
             C540,1084 760,1040 860,880
             C940,750 950,540 900,380
             C850,230 680,140 500,140
             C390,140 310,148 250,170 Z"
          fill="#FFF6F4" stroke="#E08A82" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="300" cy="320" rx="78" ry="62" fill="#F8E4E0"/>
    <ellipse cx="300" cy="320" rx="30" ry="24" fill="#F0C9C2"/>
    <ellipse cx="286" cy="308" rx="10" ry="6" fill="#FFFFFF" opacity="0.55"/>
    <text x="480" y="100" text-anchor="middle" font-size="28" font-weight="700" fill="#1C2833">Breast cancer cell</text>
  </g>

  <!-- ===================== Proteins ===================== -->
  <g id="Protein_complex">
    <rect x="360" y="360" width="200" height="108" rx="54" fill="#FDECEC"/>
    <g id="Blue_protein">
      <circle cx="424" cy="414" r="34" fill="#2E5984"/>
      <ellipse cx="410" cy="400" rx="12" ry="7" fill="#FFFFFF" opacity="0.35"/>
    </g>
    <g id="Red_protein">
      <circle cx="492" cy="414" r="34" fill="#E25555"/>
      <ellipse cx="478" cy="400" rx="12" ry="7" fill="#FFFFFF" opacity="0.35"/>
    </g>
    <g id="Yellow_protein">
      <circle cx="700" cy="414" r="34" fill="#F0C14A"/>
      <ellipse cx="686" cy="400" rx="12" ry="7" fill="#FFFFFF" opacity="0.45"/>
    </g>
    <g id="Inhibition_symbol" fill="none" stroke="#E25555" stroke-width="3" stroke-linecap="round">
      <path d="M538,414 H652"/>
      <path d="M652,394 V434"/>
    </g>
    <text x="424" y="484" text-anchor="middle" font-size="18" fill="#1C2833">Blue protein</text>
    <text x="492" y="346" text-anchor="middle" font-size="18" font-weight="700" fill="#1C2833">Red protein</text>
    <text x="700" y="346" text-anchor="middle" font-size="18" fill="#1C2833">Yellow protein</text>
  </g>

  <!-- ===================== ER and blocked bud ===================== -->
  <g id="Endoplasmic_reticulum" fill="#F3EFFA" stroke="#7A6E9A" stroke-width="2" stroke-linejoin="round">
    <path d="M190,600 C280,568 410,570 540,608 C410,636 280,634 190,600 Z"/>
    <path d="M200,664 C296,632 426,634 570,674 C426,702 296,700 200,664 Z"/>
    <path d="M210,728 C306,696 436,698 590,738 C436,766 306,764 210,728 Z"/>
    <path d="M224,792 C314,762 436,764 560,802 C436,828 314,826 224,792 Z"/>
    <text x="190" y="868" font-size="18" fill="#3D4C5C">Endoplasmic reticulum</text>
  </g>

  <g id="Blocked_vesicle">
    <circle cx="620" cy="760" r="36" fill="#FFF6D8" stroke="#E0B04A" stroke-width="3"/>
    <circle cx="620" cy="760" r="26" fill="#FFF1C2" stroke="#F0D48A" stroke-width="1.4"/>
    <g fill="#2E5984">
      <circle cx="608" cy="750" r="4"/>
      <circle cx="626" cy="758" r="4"/>
      <circle cx="612" cy="770" r="3.4"/>
      <circle cx="630" cy="772" r="3"/>
    </g>
    <path d="M590,732 C600,700 640,688 668,710" fill="none" stroke="#E0B04A" stroke-width="3" stroke-linecap="round"/>
    <text x="668" y="790" font-size="18" fill="#3D4C5C">Neuroactive protein</text>
    <text x="230" y="930" font-size="17" fill="#3D4C5C">Red protein binds blue protein and prevents</text>
    <text x="230" y="956" font-size="17" fill="#3D4C5C">yellow-dependent vesicle formation</text>
  </g>

  <!-- ===================== Secretory vesicles ===================== -->
  <g id="Secretory_vesicles">
    <text x="1040" y="250" text-anchor="middle" font-size="20" fill="#1C2833">Secretory vesicles</text>
    <g id="Vesicle_1" transform="translate(940,360)">
      <circle r="32" fill="#FFF6D8" stroke="#E0B04A" stroke-width="3"/>
      <circle r="22" fill="#FFF1C2" stroke="#F0D48A" stroke-width="1.4"/>
      <g fill="#2E5984">
        <circle cx="-8" cy="-6" r="3.6"/>
        <circle cx="6" cy="-1" r="3.6"/>
        <circle cx="-4" cy="8" r="3"/>
      </g>
    </g>
    <g id="Vesicle_2" transform="translate(1048,470)">
      <circle r="30" fill="#FFF6D8" stroke="#E0B04A" stroke-width="3"/>
      <circle r="20" fill="#FFF1C2" stroke="#F0D48A" stroke-width="1.4"/>
      <g fill="#2E5984">
        <circle cx="-7" cy="-5" r="3.4"/>
        <circle cx="6" cy="0" r="3.4"/>
        <circle cx="-3" cy="8" r="2.8"/>
      </g>
    </g>
    <g id="Vesicle_3" transform="translate(1140,340)">
      <circle r="28" fill="#FFF6D8" stroke="#E0B04A" stroke-width="3"/>
      <circle r="18" fill="#FFF1C2" stroke="#F0D48A" stroke-width="1.4"/>
      <g fill="#2E5984">
        <circle cx="-6" cy="-4" r="3.2"/>
        <circle cx="5" cy="2" r="3.2"/>
        <circle cx="-2" cy="8" r="2.6"/>
      </g>
    </g>
    <g id="Vesicle_4" transform="translate(1225,470)">
      <circle r="26" fill="#FFF6D8" stroke="#E0B04A" stroke-width="3"/>
      <circle r="17" fill="#FFF1C2" stroke="#F0D48A" stroke-width="1.4"/>
      <g fill="#2E5984">
        <circle cx="-5" cy="-3" r="3"/>
        <circle cx="5" cy="3" r="3"/>
        <circle cx="-2" cy="8" r="2.4"/>
      </g>
    </g>
    <!-- gentle drift toward the neuron -->
    <g fill="none" stroke="#E0B04A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M978,360 l16,-8 l-4,14"/>
      <path d="M1084,450 l14,-10 l-2,14"/>
      <path d="M1174,360 l16,6 l-12,8"/>
    </g>
  </g>

  <!-- ===================== Neuron ===================== -->
  <g id="Neuron">
    <text x="1488" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#1C2833">Neuron</text>
    <g fill="none" stroke="#3E6F99" stroke-width="10" stroke-linecap="round">
      <path d="M1420,300 C1400,230 1470,180 1448,140"/>
      <path d="M1560,300 C1620,240 1610,190 1680,170"/>
      <path d="M1388,340 C1320,300 1300,230 1248,210"/>
    </g>
    <circle cx="1360" cy="250" r="11" fill="#7EADD4" stroke="#3E6F99" stroke-width="2"/>
    <circle cx="1680" cy="170" r="11" fill="#7EADD4" stroke="#3E6F99" stroke-width="2"/>
    <circle cx="1248" cy="210" r="11" fill="#7EADD4" stroke="#3E6F99" stroke-width="2"/>
    <circle cx="1488" cy="430" r="128" fill="#F3F8FC" stroke="#3E6F99" stroke-width="3.2"/>
    <circle cx="1488" cy="410" r="38" fill="#D5E6F4"/>
    <!-- endocytic pocket -->
    <path d="M1368,450 C1344,424 1336,490 1376,508" fill="#F3F8FC" stroke="#3E6F99" stroke-width="3.2" stroke-linecap="round"/>
    <g id="Internalized_vesicle" transform="translate(1392,478)">
      <circle r="22" fill="#FFF6D8" stroke="#E0B04A" stroke-width="2.6"/>
      <circle r="14" fill="#FFF1C2" stroke="#F0D48A" stroke-width="1.2"/>
      <g fill="#2E5984">
        <circle cx="-4" cy="-3" r="2.6"/>
        <circle cx="4" cy="2" r="2.6"/>
        <circle cx="-2" cy="6" r="2.2"/>
      </g>
    </g>
  </g>

  <g id="Mitochondria" fill="#FFE4D2" stroke="#E07A3D" stroke-width="2">
    <g transform="translate(1460,510) rotate(-18)">
      <ellipse rx="30" ry="15"/>
      <path d="M-18,0 H18 M-10,-7 V7 M0,-9 V9 M10,-7 V7" fill="none"/>
    </g>
    <g transform="translate(1548,500) rotate(16)">
      <ellipse rx="28" ry="14"/>
      <path d="M-16,0 H16 M-8,-6 V6 M2,-8 V8 M10,-6 V6" fill="none"/>
    </g>
    <g transform="translate(1504,560) rotate(4)">
      <ellipse rx="26" ry="13"/>
      <path d="M-14,0 H14 M-7,-6 V6 M2,-7 V7 M9,-5 V5" fill="none"/>
    </g>
    <text x="1488" y="610" text-anchor="middle" font-size="18" fill="#3D4C5C">Mitochondrial activity</text>
  </g>

  <!-- Axon runs into the lower right; tumor cells ride on it -->
  <g id="Axon">
    <path d="M1608,520
             C1740,560 1880,740 1920,940
             C1960,1120 1880,1240 1760,1300"
          fill="none" stroke="#D7E8F5" stroke-width="84" stroke-linecap="round"/>
    <path d="M1608,520
             C1740,560 1880,740 1920,940
             C1960,1120 1880,1240 1760,1300"
          fill="none" stroke="#4E86B5" stroke-width="36" stroke-linecap="round"/>
    <g id="Growth_cone" transform="translate(1760,1300) rotate(130)">
      <path d="M0,-12 L46,-26 L74,-4 L52,2 L78,16 L44,22 L0,12 Z" fill="#4E86B5"/>
      <g fill="none" stroke="#4E86B5" stroke-width="3" stroke-linecap="round">
        <path d="M66,-8 L100,-26"/>
        <path d="M72,2 L110,4"/>
        <path d="M68,14 L102,28"/>
        <path d="M48,20 L66,44"/>
      </g>
    </g>
    <text x="1540" y="1260" text-anchor="end" font-size="18" fill="#3D4C5C">Axon regeneration</text>
  </g>

  <g id="Cancer_cells_on_axon">
    <text x="1580" y="860" text-anchor="middle" font-size="20" font-weight="700" fill="#1C2833">Tumor cells spread</text>
    <text x="1580" y="888" text-anchor="middle" font-size="20" font-weight="700" fill="#1C2833">along the neuron</text>
    <g id="Tumor_cell_1" transform="translate(1705,575) rotate(16)">
      <ellipse rx="42" ry="30" fill="#FFE8E4" stroke="#E07A72" stroke-width="2.6"/>
      <ellipse cx="-6" cy="0" rx="12" ry="9" fill="#F6C7C2"/>
      <path d="M24,-12 Q46,0 24,12" fill="#FFD4CE" stroke="#E07A72" stroke-width="1.8"/>
    </g>
    <g id="Tumor_cell_2" transform="translate(1848,760) rotate(38)">
      <ellipse rx="42" ry="30" fill="#FFE8E4" stroke="#E07A72" stroke-width="2.6"/>
      <ellipse cx="-6" cy="0" rx="12" ry="9" fill="#F6C7C2"/>
      <path d="M24,-12 Q46,0 24,12" fill="#FFD4CE" stroke="#E07A72" stroke-width="1.8"/>
    </g>
    <g id="Tumor_cell_3" transform="translate(1925,980) rotate(62)">
      <ellipse rx="42" ry="30" fill="#FFE8E4" stroke="#E07A72" stroke-width="2.6"/>
      <ellipse cx="-6" cy="0" rx="12" ry="9" fill="#F6C7C2"/>
      <path d="M24,-12 Q46,0 24,12" fill="#FFD4CE" stroke="#E07A72" stroke-width="1.8"/>
    </g>
    <g id="Tumor_cell_4" transform="translate(1848,1165) rotate(95)">
      <ellipse rx="42" ry="30" fill="#FFE8E4" stroke="#E07A72" stroke-width="2.6"/>
      <ellipse cx="-6" cy="0" rx="12" ry="9" fill="#F6C7C2"/>
      <path d="M24,-12 Q46,0 24,12" fill="#FFD4CE" stroke="#E07A72" stroke-width="1.8"/>
    </g>
    <g fill="none" stroke="#E07A72" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1768,620 l20,10 -6,16"/>
      <path d="M1908,830 l12,20 -16,8"/>
      <path d="M1948,1060 l-4,22 -16,2"/>
    </g>
  </g>

  <g id="Blood_vessel">
    <rect x="1360" y="1405" width="360" height="58" rx="29" fill="#FDE8E8" stroke="#E07A7A" stroke-width="2.6"/>
    <g fill="#F09A9A">
      <ellipse cx="1436" cy="1434" rx="16" ry="11"/>
      <ellipse cx="1510" cy="1434" rx="16" ry="11"/>
      <ellipse cx="1668" cy="1434" rx="16" ry="11"/>
    </g>
    <g id="Tumor_cell_in_vessel" transform="translate(1588,1434)">
      <ellipse rx="24" ry="16" fill="#FFE8E4" stroke="#E07A72" stroke-width="2.2"/>
      <ellipse cx="-3" cy="0" rx="7" ry="5" fill="#F6C7C2"/>
    </g>
    <text x="1540" y="1504" text-anchor="middle" font-size="18" fill="#3D4C5C">Blood vessel</text>
  </g>

  <g id="Lymph_node">
    <path d="M1968,1360
             C1968,1308 2060,1288 2116,1324
             C2184,1368 2178,1468 2102,1502
             C2036,1530 1958,1500 1952,1440
             C1948,1410 1974,1408 1996,1422
             C2026,1442 2034,1410 2018,1388
             C2002,1366 1980,1382 1968,1360 Z"
          fill="#F8F1EA" stroke="#B08A68" stroke-width="2.6" stroke-linejoin="round"/>
    <g id="Tumor_cell_in_node" transform="translate(2076,1424)">
      <ellipse rx="24" ry="16" fill="#FFE8E4" stroke="#E07A72" stroke-width="2.2"/>
      <ellipse cx="-3" cy="0" rx="7" ry="5" fill="#F6C7C2"/>
    </g>
    <text x="2070" y="1572" text-anchor="middle" font-size="18" fill="#3D4C5C">Lymph node</text>
  </g>

  <g id="Lung">
    <path d="M2240,1240
             C2180,1288 2170,1400 2236,1456
             C2286,1498 2372,1488 2406,1428
             C2432,1484 2488,1460 2488,1388
             C2488,1300 2440,1230 2360,1224
             C2312,1184 2268,1200 2240,1240 Z"
          fill="#F4F7F9" stroke="#8B97A3" stroke-width="2.4" stroke-linejoin="round"/>
    <ellipse cx="2348" cy="1356" rx="26" ry="18" fill="#F6C9C9" stroke="#E07A72" stroke-width="2"/>
    <text x="2348" y="1540" text-anchor="middle" font-size="18" font-weight="700" fill="#1C2833">Lung metastasis</text>
  </g>
</svg>
